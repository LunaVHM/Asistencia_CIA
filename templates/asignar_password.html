<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establecer Contraseña - C.I.A.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card p-4 shadow" style="width: 380px; border-radius: 12px; background: white;">
    <div class="text-center mb-3">
        <h4 class="text-success fw-bold mb-1">🔒 Token Verificado</h4>
        <p class="text-muted small">El correo electrónico ha sido comprobado con éxito. Ahora, asigna tu contraseña de acceso.</p>
    </div>

    <form action="/asignar_password" method="POST" id="formPassword">
        <div class="mb-3">
            <label class="form-label small fw-bold">Nueva Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label small fw-bold">Confirmar Contraseña</label>
            <input type="password" id="confirmar_contrasena" class="form-control" placeholder="Repite tu contraseña" required>
            <div id="error_msg" class="form-text text-danger d-none">⚠️ Las contraseñas no coinciden.</div>
        </div>

        <button type="submit" id="btnEnviar" class="btn btn-success w-100 fw-bold shadow-sm py-2">Finalizar Registro y Generar QR</button>
    </form>
</div>

<script>
    const contrasena = document.getElementById('contrasena');
    const confirmar = document.getElementById('confirmar_contrasena');
    const errorMsg = document.getElementById('error_msg');
    const btnEnviar = document.getElementById('btnEnviar');

    function validarContrasenas() {
        if (confirmar.value === "") {
            errorMsg.classList.add('d-none');
            btnEnviar.disabled = false;
        } else if (contrasena.value !== confirmar.value) {
            errorMsg.classList.remove('d-none');
            btnEnviar.disabled = true;
        } else {
            errorMsg.classList.add('d-none');
            btnEnviar.disabled = false;
        }
    }

    contrasena.addEventListener('input', validarContrasenas);
    confirmar.addEventListener('input', validarContrasenas);
</script>
</body>
</html>

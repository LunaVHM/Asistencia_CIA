<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA - Auto-Registro de Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 40px 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="mb-0">Sistema CIA: Registro Escolar</h3>
                        <small>Crea tu cuenta institucional de alumno autónomamente</small>
                    </div>
                    <div class="card-body p-4">
                        <form action="/alumnos/solicitar_registro" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Matrícula</label>
                                <input type="text" name="matricula" class="form-control" placeholder="Ej. 20260123" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre Completo</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Tu nombre completo" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo Institucional</label>
                                <input type="email" name="correo" class="form-control" placeholder="ejemplo@alumno.utc.edu.mx" required>
                                <div class="form-text text-muted small">Obligatorio dominio @alumno.utc.edu.mx</div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold">Edificio</label>
                                    <input type="text" name="edificio" class="form-control" placeholder="Ej. Docencia 4" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Salón</label>
                                    <input type="text" name="salon" class="form-control" placeholder="Ej. Aula 10" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Sección / Grupo Especializado</label>
                                <input type="text" name="seccion" class="form-control" placeholder="Ej. 3AUTOND" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Solicitar Código de Activación</button>
                        </form>
                    </div>
                    <div class="card-footer text-center bg-white">
                        <a href="/login" class="btn btn-link btn-sm text-secondary">¿Ya tienes cuenta? Inicia Sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

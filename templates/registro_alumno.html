<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alumnos - CIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(14, 68, 3, 0.7), rgba(14, 68, 3, 0.7)), 
                        url('https://mexicoindustry.com/admin/images/notas/2020/12/refuerzan-alumnos-de-utc-su-experiencia-laboral-y-academica-4969.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            padding: 30px 0;
        }
        .card { border-radius: 15px; background: rgba(255, 255, 255, 0.95); }
        .card-header { background-color: #D1B200 !important; color: #000 !important; font-weight: bold; }
        .btn-primary { background-color: #0E4403 !important; border-color: #0E4403 !important; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header text-center py-3">
                        <h4 class="mb-0">Formulario de Auto-Registro Alumno</h4>
                    </div>
                    <div class="card-body p-4">
                        <form action="/alumnos/solicitar_registro" method="POST" id="formRegistro">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Matrícula</label>
                                <input type="text" name="matricula" class="form-control" placeholder="Ej. 24052489" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Nombre Completo</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Apellidos y nombre (s)" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Sección / Grupo</label>
                                <input type="text" name="seccion" class="form-control" placeholder="Ej. 3AUTOND" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Correo Electrónico Institucional</label>
                                <input type="email" name="correo" class="form-control" placeholder="ejemplo@alumno.utc.edu.mx" required autocomplete="off">
                                <div class="form-text text-muted small">Obligatorio dominio @alumno.utc.edu.mx</div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2" id="btnRegistrar">
                                <span id="textoBoton">Solicitar Token y Registrarme</span>
                                <span id="spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

   <script>
        document.getElementById('formRegistro').addEventListener('submit', function() {
            // 1. Cambiamos el texto
            document.getElementById('textoBoton').innerText = "Procesando...";
            
            // 2. Mostramos el circulito
            document.getElementById('spinner').classList.remove('d-none');
            
            // 3. ¡ELIMINAMOS el bloqueo del botón! 
            // Dejamos que el navegador haga su trabajo libremente.
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Identidad - C.I.A.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(14, 68, 3, 0.7), rgba(14, 68, 3, 0.7)), 
                        url('https://mexicoindustry.com/admin/images/notas/2020/12/refuerzan-alumnos-de-utc-su-experiencia-laboral-y-academica-4969.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { background-color: rgba(255, 255, 255, 0.95); border-radius: 12px; width: 380px; }
        .btn-success { background-color: #0E4403 !important; border-color: #0E4403 !important; }
        .text-success { color: #0E4403 !important; }
    </style>
</head>
<body>

<div class="card p-4 shadow text-center">
    <h4 class="text-success fw-bold mb-1">📧 Confirmación de Token</h4>
    <p class="text-muted small">Ingresa el código de 4 dígitos enviado a tu correo institucional:<br><strong class="text-dark">{{ correo }}</strong></p>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger p-2 small text-center alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/verificar_codigo" method="POST">
        <div class="mb-4">
            <input type="text" 
                   name="codigo_otp" 
                   class="form-control text-center fs-2 fw-bold font-monospace text-success tracking-wider" 
                   placeholder="0000" 
                   maxlength="4" 
                   pattern="[0-9]{4}" 
                   inputmode="numeric" 
                   required 
                   autocomplete="off"
                   autofocus>
            <div class="form-text small text-muted">El código debe constar exactamente de 4 dígitos.</div>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm py-2">Validar Token Escolar</button>
    </form>

    <form action="/reenviar_codigo" method="POST" class="mt-3">
        <button type="submit" class="btn btn-link btn-sm text-decoration-none" style="color: #0E4403;">
            No recibí el código, reenviar
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
